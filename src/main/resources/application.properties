# =============================================================================
# application.properties - configuration of Spring Boot AND the embedded Camunda 7 engine
# =============================================================================
# Everything under "camunda.bpm.*" is read by the Camunda Spring Boot starter and
# turned into a SpringProcessEngineConfiguration. Anything the starter does not
# expose as a typed property can still be set via
#   camunda.bpm.generic-properties.properties.<setterName>=<value>
# which maps 1:1 onto setters of ProcessEngineConfigurationImpl.
#
# NOTE: .properties files do NOT support comments at the end of a line.
# "key=value  # comment" would make "value  # comment" the value!
# That is why every comment below is on its own line.
# =============================================================================

server.port=8080
spring.application.name=camunda7-engine-academy

# -----------------------------------------------------------------------------
# Database
# -----------------------------------------------------------------------------
# File-based H2 so process instances survive a restart (try it: start a loan,
# stop the app, start it again, and the task is still in Tasklist).
# PRODUCTION: use PostgreSQL / Oracle / SQL Server / MySQL / MariaDB, e.g.
#   spring.datasource.url=jdbc:postgresql://db:5432/camunda
#   spring.datasource.username=camunda
#   spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=jdbc:h2:file:./camunda-h2-db/process-engine;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=sa

# H2 console: http://localhost:8080/h2-console -> look at ACT_RU_* / ACT_HI_* tables
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# Web apps login
# -----------------------------------------------------------------------------
# Created on first start. Member of group "camunda-admin" = full rights.
camunda.bpm.admin-user.id=demo
camunda.bpm.admin-user.password=demo
camunda.bpm.admin-user.first-name=Demo
camunda.bpm.admin-user.last-name=Admin
# Creates a Tasklist filter so the admin immediately sees all tasks.
camunda.bpm.filter.create=All tasks

# -----------------------------------------------------------------------------
# Database schema
# -----------------------------------------------------------------------------
# true = engine creates/updates the ACT_* tables automatically.
# PRODUCTION: set to false and run the official SQL scripts / Liquibase
# changelog shipped with Camunda, under DBA control.
camunda.bpm.database.schema-update=true

# -----------------------------------------------------------------------------
# History
# -----------------------------------------------------------------------------
# none | activity | audit | full. "full" records every variable change and
# every DMN evaluation (needed for Cockpit's decision history views).
# PRODUCTION: "audit" or "full" + history cleanup (see generic properties).
camunda.bpm.history-level=full

# -----------------------------------------------------------------------------
# Variables
# -----------------------------------------------------------------------------
# Java objects put into process variables are stored as JSON (via Spin +
# Jackson) instead of Java serialization. JSON is readable in Cockpit,
# language neutral, and safe. (Java serialization is disabled by default.)
camunda.bpm.default-serialization-format=application/json

# -----------------------------------------------------------------------------
# Job executor
# -----------------------------------------------------------------------------
# The job executor is the engine's thread pool that executes "jobs":
# timers, async continuations, retries. Without it, timers never fire.
camunda.bpm.job-execution.enabled=true
camunda.bpm.job-execution.core-pool-size=3
camunda.bpm.job-execution.max-pool-size=10

# -----------------------------------------------------------------------------
# Auto deployment
# -----------------------------------------------------------------------------
# Every **/*.bpmn, **/*.dmn and **/*.cmmn on the classpath is deployed on
# startup (one deployment). Unchanged resources are NOT redeployed (duplicate
# filtering), so restarts don't create new versions needlessly.
camunda.bpm.auto-deployment-enabled=true

# -----------------------------------------------------------------------------
# Generic engine properties (setters of ProcessEngineConfigurationImpl)
# -----------------------------------------------------------------------------
# Since 7.20 the engine REFUSES to deploy a process/decision without a history
# time-to-live (enforceHistoryTimeToLive=true). Every model in this project sets
# camunda:historyTimeToLive explicitly; this default is the safety net.
camunda.bpm.generic-properties.properties.historyTimeToLive=P30D

# History cleanup removes ACT_HI_* rows whose TTL expired (runs in this window).
camunda.bpm.generic-properties.properties.historyCleanupBatchWindowStartTime=01:00
camunda.bpm.generic-properties.properties.historyCleanupBatchWindowEndTime=05:00

# When an async job fails, retry 3 times, 10 seconds apart, then create an
# incident (visible in Cockpit). Activities override this with
# camunda:failedJobRetryTimeCycle.
camunda.bpm.generic-properties.properties.failedJobRetryTimeCycle=R3/PT10S

# Jobs are picked up highest-priority first.
camunda.bpm.generic-properties.properties.jobExecutorAcquireByPriority=true

# User / group / tenant ids are validated against a whitelist regex.
# Default is "[a-zA-Z0-9]+|camunda-admin" -> ids with hyphens such as
# "fraud-investigators" are REJECTED ("is not a valid resource identifier").
# We allow hyphens because our BPMN candidateGroups use them.
# (Finer control: userResourceWhitelistPattern / groupResourceWhitelistPattern /
#  tenantResourceWhitelistPattern.)
camunda.bpm.generic-properties.properties.generalResourceWhitelistPattern=[a-zA-Z0-9-]+

# -----------------------------------------------------------------------------
# Spring eventing bridge (see SpringEngineEventListeners.java)
# -----------------------------------------------------------------------------
# Publish engine events as Spring application events.
camunda.bpm.eventing.task=true
# Set to true to receive an ExecutionEvent for every activity start/end.
camunda.bpm.eventing.execution=false
camunda.bpm.eventing.history=false

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.academy=DEBUG
# Uncomment to watch the engine's SQL (great for learning, noisy in prod):
# logging.level.org.camunda.bpm.engine.impl.persistence.entity=DEBUG
# Uncomment to see job acquisition / execution:
# logging.level.org.camunda.bpm.engine.jobexecutor=DEBUG